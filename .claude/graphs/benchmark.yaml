# Executor: herd-sdlc-engineer. The supermarket benchmark, with and without Herd. Node details: agent file, "Benchmark".
name: benchmark
start: ground
nodes:
  ground:        {type: act, ref: "Benchmark", does: "Read examples/supermarket-route: the README, the last results table, the goal files and the verifier", next: plan}
  plan:          {type: think, does: "Legs (model by with or without Herd), runs per leg, large stores in or out, Herd version in the run name", next: same_input}
  same_input:    {type: check, does: "Every leg gets the same goal file verbatim; baselines have no Herd or Superpowers installed and start from a clean context", pass: gate_cost, fail: plan}
  gate_cost:     {type: gate, ask: "Run these legs and runs (time and cost estimate shown)? A request that already asked opens it", approve: run, edit: plan, skip: report}
  run:           {type: act, side_effect: true, does: "Start the runs in the background; record start and end time; give a progress table when asked", next: score}
  score:         {type: act, does: "Hidden general verifier and robustness probe on each run; tokens, cost and build time", next: integrity}
  integrity:     {type: check, does: "No baseline used Herd; every run has a score, a cost and a time; failed launches are reported, not dropped", pass: stats, fail: plan, max: 2, on_exhausted: stats}
  stats:         {type: act, does: "Mean and standard deviation per KPI and leg; cost per run", next: losses}
  losses:        {type: check, does: "Any run lost a store or a probe case", pass: root_cause, fail: publish_asked}
  root_cause:    {type: think, does: "One bug class per loss; propose Herd changes that would catch it, ranked by added time and cost; no word specific to the benchmark", next: publish_asked}
  publish_asked: {type: check, does: "Toni asked to update the README or the published results", pass: write_results, fail: report}
  write_results: {type: act, does: "Update the README and the example: version, models, runs, mean and std, cost; regenerate the chart; commit goes through change.yaml", next: report}
  report:        {type: end, does: "Table per leg; root causes; proposals; what was not run"}
