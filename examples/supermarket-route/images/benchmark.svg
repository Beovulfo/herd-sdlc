<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<text x="16" y="28" font-size="18" font-weight="bold" fill="#111">Same prompt, same model (Sonnet), with and without Herd</text>
<text x="16" y="48" font-size="12" fill="#555">Each pair of bars is scaled to its larger value. One run per arm.</text>
<text x="16" y="95" font-size="13" fill="#222">Stores solved with a valid route (of 48)</text>
<rect x="300" y="74" width="360" height="17" rx="2" fill="#2e7d32"/><text x="668" y="87" font-size="12" fill="#222">48</text>
<rect x="300" y="95" width="285" height="17" rx="2" fill="#d08770"/><text x="593" y="108" font-size="12" fill="#222">38</text>
<text x="16" y="147" font-size="13" fill="#222">Bad-input scenarios handled (of 6)</text>
<rect x="300" y="126" width="360" height="17" rx="2" fill="#2e7d32"/><text x="668" y="139" font-size="12" fill="#222">6</text>
<rect x="300" y="147" width="240" height="17" rx="2" fill="#d08770"/><text x="548" y="160" font-size="12" fill="#222">4</text>
<text x="16" y="199" font-size="13" fill="#222">Test lines written</text>
<rect x="300" y="178" width="360" height="17" rx="2" fill="#2e7d32"/><text x="668" y="191" font-size="12" fill="#222">119</text>
<rect x="300" y="199" width="61" height="17" rx="2" fill="#d08770"/><text x="369" y="212" font-size="12" fill="#222">20</text>
<text x="16" y="251" font-size="13" fill="#222">Time to finish</text>
<rect x="300" y="230" width="360" height="17" rx="2" fill="#2e7d32"/><text x="668" y="243" font-size="12" fill="#222">3.3 min</text>
<rect x="300" y="251" width="115" height="17" rx="2" fill="#d08770"/><text x="423" y="264" font-size="12" fill="#222">1.05 min</text>
<text x="16" y="303" font-size="13" fill="#222">Tokens used</text>
<rect x="300" y="282" width="360" height="17" rx="2" fill="#2e7d32"/><text x="668" y="295" font-size="12" fill="#222">87k</text>
<rect x="300" y="303" width="302" height="17" rx="2" fill="#d08770"/><text x="610" y="316" font-size="12" fill="#222">73k</text>
<rect x="16" y="342" width="12" height="12" fill="#2e7d32"/><text x="34" y="353" font-size="12" fill="#222">with Herd</text><rect x="120" y="342" width="12" height="12" fill="#d08770"/><text x="138" y="353" font-size="12" fill="#222">without Herd</text>
<text x="16" y="378" font-size="11" fill="#666">Both runs were clean subagents. The Herd run followed the skills and ran the real CLI; no hooks, no reviewer.</text>
</svg>