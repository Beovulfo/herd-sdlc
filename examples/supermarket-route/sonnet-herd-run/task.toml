goal = "Build a route optimizer that works inside any supermarket, any size or layout. Input: a MAP of the supermarket with all products localised (product ID, short name), and a customer list of products (id:short name). Goal: best route for the delivery guy preparing the basket. Simulate the route step by step, measuring in real time the KPIs time-to-prepare-basket and distance-covered, and compare against the list-order (not optimized) route to demonstrate the optimizer saves more than 30% of the time until the basket is ready."

test_budget = "About 15 unittest tests in one file, one per behaviour (layouts, scale, simulation, savings, input errors, route quality). No per-function suites, no mocks."

known_limits = "The >30% saving holds for synthetic aisle and random-obstacle stores with at least 20 randomly ordered items (10 items usually, not always: see measurements), 1 m cells, 1.2 m/s walking and 5 s pick dwell. Measured on 60 seeded 41x31 aisle stores, time saving is below 30% in 60/60 runs for 1 item, 41/60 for 3 items, 26/60 for 5 items, 3/60 for 10 items (min 21.9%, median 42.6%), 0/60 for 20 items (min 32.8%, median 51.0%). It also shrinks for lists already in near-optimal order and when pick dwell dominates walking (constant pick time dilutes the time saving). A repeated product id is one stop (quantity is not modelled). Planning 500 stops on a 250x250 store takes about 10 s; larger lists are untested. The route is a heuristic (nearest neighbour + 2-opt + or-opt), not provably optimal; each product is picked from one fixed walkable neighbour cell; movement is 4-connected on a single-floor grid with no one-way aisles, queues or blocked-by-people effects."

[[criteria]]
id = "C1"
text = "works inside any supermarket, even very big ones, whatever layout"
source = "human"
check = "python3 -m unittest test_routeopt.TestLayouts test_routeopt.TestScale"
coverage = "Proves a valid route (all items, adjacent walkable steps, start to end) on aisle grids, open-plan, random-obstacle and winding-corridor stores, plus a 250x250 store with thousands of products inside a time bound. Does not prove real store maps, multi-floor stores or lists of thousands of items."

[[criteria]]
id = "C2"
text = "we can simulate step by step route delivery guy, measuring in real time KPIs"
source = "human"
check = "python3 -m unittest test_routeopt.TestSimulation"
coverage = "Proves the simulation yields one event per step and per pick with running distance-covered and time-to-prepare-basket that never decrease, end at the planned route totals, and that the CLI --live output prints them as it goes. Does not prove wall-clock pacing accuracy: --speedup N sleeps between events but is only exercised at a huge N."

[[criteria]]
id = "C3"
text = "demonstrate our optimization algorithm successfully saves more 30% time basket ready"
source = "human"
check = "python3 -m unittest test_routeopt.TestSavings"
coverage = "Proves time-to-prepare-basket (walk + pick dwell + walk to end) is more than 30% lower than list-order on every seeded synthetic store/list scenario (10 to 80 items, 8 seeded cases, aisle, open-plan and random layouts). Also proves it for the worst of 30 seeds per layout at 20 items. Does not prove it for real lists, real maps, lists under 20 items (see known_limits), or lists already well ordered (route is then never longer than list order, saving near 0)."

[[criteria]]
id = "C4"
text = "Given a bad map or list (unknown product id, unreachable product, malformed grid, blocked start), when loaded, then a clear ValueError names the problem instead of a wrong route."
source = "agent-proposed"
check = "python3 -m unittest test_routeopt.TestInputErrors"

[[criteria]]
id = "C5"
text = "Given small lists, when optimized, then the route is never longer than list-order and within 10 percent of the brute-force optimum."
source = "agent-proposed"
check = "python3 -m unittest test_routeopt.TestRouteQuality"
