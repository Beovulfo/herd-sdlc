goal = "Supermarket picker route optimizer: supermarket.py simulate (optimized|random|list-order) on JSON map and list, JSON-lines step output with live KPIs, optimized mean time-to-prepare more than 20 percent below random walk over many seeded baskets."

test_budget = "Unit: Held-Karp optimality vs brute force, start-cell pick, duplicates. Integration: seeded-basket mean comparison on the example store (30 baskets of 8). End to end: the real CLI for JSON-lines protocol, determinism, error exits. Untested on purpose: lists above 12 items (2-opt fallback), maps above 100x100, wall-clock speed."

[[criteria]]
id = "C1"
text = "Over many seeded baskets, the mean time-to-prepare of the optimized algorithm is more than 20 percent lower than the mean of the random walk, and the simulation emits the KPIs step by step while it runs."
source = "human"
check = "python3 -m unittest -v tests.test_supermarket.MeanSavingsTests tests.test_supermarket.StreamingTests"

[[criteria]]
id = "C2"
text = "Given a map and list, when `supermarket.py simulate` runs with each of optimized, random and list-order, then stdout is step JSON lines (n from 1, pos, time, distance, picked) followed by exactly one final line, moves are single walkable cells, every item is picked once at its cell, and one time model holds for all algorithms"
source = "agent-proposed"
check = "python3 -m unittest tests.test_supermarket.StdoutProtocolTests"

[[criteria]]
id = "C3"
text = "Given a small store, when optimized runs, then its distance equals the brute-force optimum; items on the start cell are picked and duplicate list entries are counted once; list-order visits in list order"
source = "agent-proposed"
check = "python3 -m unittest tests.test_supermarket.OptimalityTests"

[[criteria]]
id = "C4"
text = "Given an empty list, then the final line has zero time, distance and picks (exit 0); given an unknown product ID, an unreachable product, a start on a wall or a malformed map or list, then stderr has a clear error, stdout is empty and the exit is non-zero"
source = "agent-proposed"
check = "python3 -m unittest tests.test_supermarket.EdgeCaseTests"
