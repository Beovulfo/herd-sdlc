<rect x="500" y="156" width="84" height="18" fill="#2e7d32" opacity=".55"/><text x="590" y="169" font-size="12" fill="#222">3.0 min</text>
<text x="16" y="199" font-size="12" fill="#222">Haiku, no workflow</text>
<rect x="190" y="186" width="120" height="18" fill="#d08770"/><text x="316" y="199" font-size="12" fill="#222">3 of 6</text>
<rect x="500" y="186" width="42" height="18" fill="#d08770" opacity=".55"/><text x="548" y="199" font-size="12" fill="#222">1.5 min</text>
