name: Bug report
description: Report something Herd gets wrong
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Do not paste secrets, tokens or private data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: herd-version
    attributes:
      label: Herd version
    validations:
      required: true
  - type: textarea
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: textarea
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
