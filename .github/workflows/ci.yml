name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t .
      - run: python examples/supermarket-route/verifier/test_verify_general.py
      - run: python -m unittest test_run_leg test_leak_audit
        working-directory: examples/supermarket-route/verifier
      - run: python -m unittest test_bus_verify
        working-directory: examples/bus-transfer/verifier
        env:
          BUS_FULL: "1"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.15.16 check .
