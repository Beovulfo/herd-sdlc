# Executor: herd-sdlc-engineer. Tag and publish a release that is already merged to main.
name: release
start: ground
nodes:
  ground:        {type: act, does: "Read plugin.json version, the top CHANGELOG entry, git tags, gh release list and main's CI", next: version_ok}
  version_ok:    {type: check, does: "plugin.json version equals the top CHANGELOG entry, is not tagged yet, and main's CI is green", pass: smoke_needed, fail: report}
  smoke_needed:  {type: check, does: "This release changes the run flow, a hook or a gate", pass: smoke, fail: gate_tag}
  smoke:         {type: sub, graph: benchmark, does: "One Haiku leg with Herd, no large stores", next: smoke_ok}
  smoke_ok:      {type: check, does: "The smoke run passed the verifier and the probe", pass: gate_tag, fail: report, note: "on fail, fix through change.yaml first; never tag a failing run"}
  gate_tag:      {type: gate, ask: "Tag vX.Y.Z and publish the release with its CHANGELOG entry?", approve: tag, skip: report}
  tag:           {type: act, side_effect: true, does: "git tag, push the tag as Beovulfo, gh release create with the CHANGELOG entry", next: tag_check}
  tag_check:     {type: check, does: "gh release view shows the tag and the notes", pass: gate_upgrade, fail: tag, max: 1, on_exhausted: report}
  gate_upgrade:  {type: gate, ask: "Upgrade the local install (claude plugin update herd@herd-sdlc)?", approve: upgrade, skip: report}
  upgrade:       {type: act, side_effect: true, does: "Update the plugin and confirm the installed version", next: report}
  report:        {type: end, does: "Release link, installed version, what was not checked"}
