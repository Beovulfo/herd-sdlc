name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest scripts.test_herd_cli scripts.test_herd_lint scripts.test_herd_detect scripts.test_herd_triage scripts.test_herd_arbiter scripts.test_herd_escalation
      - run: python examples/supermarket-route/verifier/test_verifier.py
      - run: python examples/supermarket-route/verifier/test_verify_general.py
