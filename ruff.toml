# The agent-written solutions and adapters in the benchmark are kept exactly as the runs produced them.
extend-exclude = ["examples/supermarket-route/with-herd", "examples/supermarket-route/without-herd",
                  "examples/supermarket-route/runs"]

[lint]
select = ["E4", "E7", "E9", "F"]  # pyflakes and syntax-level pycodestyle, fixed so new ruff defaults do not move the bar
ignore = ["E731"]  # small lambdas in tests read fine
