<rect x="190" y="246" width="160" height="18" fill="#d08770"/><text x="356" y="259" font-size="12" fill="#222">4 of 6</text>
<rect x="500" y="246" width="31" height="18" fill="#d08770" opacity=".55"/><text x="537" y="259" font-size="12" fill="#222">1.1 min</text>
<rect x="16" y="286" width="12" height="12" fill="#2e7d32"/><text x="34" y="297" font-size="12" fill="#222">with Herd</text><rect x="120" y="286" width="12" height="12" fill="#d08770"/><text x="138" y="297" font-size="12" fill="#222">no workflow</text>
<text x="16" y="320" font-size="11" fill="#666">One run per arm. Herd runs on Haiku were emulated by following the skills; the Sonnet Herd time includes any time the session waited.</text>
